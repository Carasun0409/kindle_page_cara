<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="120">
  <title>Codex Kindle Dashboard</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;color:#111}
    body{font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}
    body{overflow:hidden}
    img{position:fixed;left:0;top:0;display:block;width:100vh;height:auto;margin:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%);-webkit-transform-origin:top left;-webkit-transform:rotate(90deg) translateY(-100%)}
    .error{padding:3em 1em;font-size:22px}
  </style>
</head>
<body>
  <img id="dashboard" src="dashboard.png" alt="Codex dashboard" onerror="this.style.display='none';document.getElementById('error').style.display='block'">
  <div id="error" class="error" style="display:none">看板暂时不可用，请稍后刷新。</div>
  <script>
    (function(){var image=document.getElementById('dashboard');image.src='dashboard.png?t='+new Date().getTime();}());
  </script>
</body>
</html>
