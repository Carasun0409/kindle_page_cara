<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Codex 今日工作台</title>
  <style>
    html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;color:#111}
    body{font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}
    img{display:block;width:100%;height:auto;margin:0 auto;background:#fff}
    #status{padding:36px 12px;font-size:17px}
  </style>
</head>
<body>
  <img id="dashboard" alt="Codex 今日工作台">
  <div id="status">正在获取最新看板…</div>
  <script>
  (function(){
    var image=document.getElementById('dashboard'),status=document.getElementById('status'),timer=null,lastAttempt=0;
    var SOURCE='https://raw.githubusercontent.com/Carasun0409/kindle_page_cara/live-data/dashboard.png';
    function update(){var now=new Date().getTime();if(now-lastAttempt<15000)return;lastAttempt=now;var next=new Image();next.onload=function(){image.src=next.src;image.style.display='block';status.style.display='none';if(timer)clearTimeout(timer);timer=setTimeout(update,120000)};next.onerror=function(){status.innerHTML=image.src?'本次更新失败，继续显示上次看板。':'看板暂时不可用，2 分钟后自动重试。';status.style.display='block';if(timer)clearTimeout(timer);timer=setTimeout(update,120000)};next.src=SOURCE+'?t='+now}
    window.onfocus=update;if(document.addEventListener)document.addEventListener('visibilitychange',function(){if(!document.hidden)update()});update();
  }());
  </script>
</body>
</html>
