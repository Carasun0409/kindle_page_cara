<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow,noarchive"><title>Codex 今日工作台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111}body{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.25}.page{width:100%;max-width:760px;margin:0 auto;padding:12px}.head{height:39px;border-bottom:3px solid #111;position:relative}.head h1{font-size:23px;margin:0;line-height:32px}.stamp{position:absolute;right:0;top:3px;font-size:10px;text-align:right;color:#333}.status{border:1px solid #555;margin:8px 0;padding:5px 8px;font-size:12px}.status.error{border:2px solid #111}.quota{border-bottom:2px solid #111;padding:10px 0;height:128px}.ring{float:left;width:106px;height:106px;border:13px solid #ddd;border-radius:54px;position:relative;text-align:center}.ring-value{position:absolute;border:13px solid #111;border-radius:54px;left:-13px;top:-13px;width:106px;height:106px;clip:rect(0,106px,106px,53px)}.ring-inner{position:absolute;left:4px;top:22px;width:72px;z-index:2}.ring-inner b{font-size:27px;display:block}.ring-inner small{font-size:11px}.quota-copy{margin-left:124px;padding-top:5px}.quota-copy h2{font-size:18px;margin:0 0 8px}.countdown{font-size:21px;font-weight:bold;margin:4px 0}.credits{display:inline-block;border:1px solid #111;padding:4px 10px;margin-top:4px}.metrics{display:table;table-layout:fixed;border-spacing:7px;margin:1px -7px 4px;width:calc(100% + 14px)}.metric{display:table-cell;border:1px solid #444;padding:8px;vertical-align:top}.metric h2{font-size:15px;margin:0}.metric .big{font-size:25px;font-weight:bold;margin:5px 0}.bar{height:8px;border:1px solid #111;white-space:nowrap;overflow:hidden}.bar i{height:100%;display:inline-block}.u{background:#111}.c{background:#888}.o{background:#fff}.parts{font-size:10px;margin-top:5px}.parts span{display:block;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;border:1px solid #111}.dot.u{background:#111}.dot.c{background:#888}.dot.o{background:#fff}.section{border:1px solid #444;margin-top:8px;padding:8px}.section h2{font-size:17px;margin:0 0 6px;border-bottom:1px solid #555;padding-bottom:5px}.badge{float:right;border:1px solid #111;padding:0 5px;font-size:13px}.active-row{padding:5px 0;border-bottom:1px solid #bbb}.active-row:last-child{border-bottom:0}.active-row b{display:block;font-size:14px}.active-row small{color:#333}.project{font-size:16px;font-weight:bold;padding:2px 0 6px}.todos{list-style:none;margin:0;padding:0}.todos li{border-top:1px solid #bbb;padding:6px 0;font-size:14px;min-height:28px}.box{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border:1px solid #111;margin-right:7px;font-weight:bold;vertical-align:top}.done .box{background:#111;color:#fff}.done .todo-text{text-decoration:line-through;color:#555}.heat{white-space:nowrap;text-align:center}.heat-row{height:13px}.heat-label{display:inline-block;width:36px;text-align:left;font-size:9px;color:#444}.cell{display:inline-block;width:13px;height:11px;margin:1px 2px;border:1px solid #aaa;border-radius:2px;vertical-align:top}.l0{background:#fff}.l1{background:#ddd}.l2{background:#aaa}.l3{background:#666}.l4{background:#111}.today{outline:1px solid #111}.future{visibility:hidden}.foot{font-size:10px;color:#444;text-align:center;margin:7px 0}.clear{clear:both}@media(max-width:430px){body{font-size:12px}.page{padding:8px}.head h1{font-size:20px}.stamp{font-size:9px}.metric{padding:5px}.metric .big{font-size:19px}.parts{font-size:9px}.cell{width:10px;margin:1px}.heat-label{width:31px}.section{padding:6px}.todos li{padding:5px 0}}
</style></head><body><main class="page"><header class="head"><h1>Codex · 今日工作台</h1><div id="stamp" class="stamp">正在连接最新数据…</div></header><div id="status" class="status">首次读取中。之后每 2 分钟自动更新。</div><section id="quota" class="quota"></section><section id="metrics" class="metrics"></section><section class="section"><h2>当前活跃 <span id="active-count" class="badge">?</span></h2><div id="active"></div></section><section class="section"><h2>项目 TODO <span id="todo-count" class="badge">?</span></h2><div id="todo"></div></section><section class="section"><h2>Token 活动</h2><div id="activity" class="heat"></div></section><footer class="foot">网页数据由电脑端发布 · 页面无需手动刷新</footer></main>
<script>
(function(){var API='https://api.github.com/repos/Carasun0409/kindle_page_cara/contents/dashboard.json?ref=live-data',INTERVAL=120000,lastGood=null,timer=null;
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function num(n){if(n==null)return'未知';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.round(n))}function localTime(t){if(!t)return'未知';var d=new Date(t);return('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}function countdown(t){var d=Date.parse(t)-Date.now();if(!isFinite(d))return'重置时间未知';if(d<=0)return'等待额度同步';var m=Math.ceil(d/60000),day=Math.floor(m/1440),h=Math.floor(m%1440/60);return'还有 '+(day?day+'天 ':'')+(h?h+'小时 ':'')+(m%60)+'分重置'}
function metric(title,s){if(!s)return'<article class="metric"><h2>'+title+'</h2><div class="big">未知</div></article>';var total=s.total||0;function w(k){return total?Math.max(0,s[k]||0)/total*100:0}return'<article class="metric"><h2>'+title+'</h2><div class="big">'+num(s.total)+'</div><div class="bar"><i class="u" style="width:'+w('uncached')+'%"></i><i class="c" style="width:'+w('cached')+'%"></i><i class="o" style="width:'+w('output')+'%"></i></div><div class="parts"><span><i class="dot u"></i>未缓存 '+num(s.uncached)+'</span><span><i class="dot c"></i>缓存 '+num(s.cached)+'</span><span><i class="dot o"></i>输出 '+num(s.output)+'</span></div></article>'}
function render(data){lastGood=data;var q=data.quota||{},wins=q.windows||[],w=null,i;for(i=0;i<wins.length;i++)if(wins[i].name==='7d')w=wins[i];if(!w)w=wins[0];var remain=w?Math.max(0,Math.min(100,100-w.pct)):null;document.getElementById('quota').innerHTML='<div class="ring"><div class="ring-value" style="opacity:'+(remain==null?0:1)+'"></div><div class="ring-inner"><small>'+(w?esc(w.name):'额度')+'</small><b>'+(remain==null?'?':Math.round(remain)+'%')+'</b><small>剩余额度</small></div></div><div class="quota-copy"><h2>OpenAI Codex</h2><div class="countdown">'+(w?countdown(w.resets_at):'额度暂不可用')+'</div><div class="credits">可用 reset <b>'+(q.resetCredits==null?'未知':q.resetCredits)+'</b> 次</div></div><div class="clear"></div>';var usage=data.local&&data.local.usage||{};document.getElementById('metrics').innerHTML=metric('今日',usage.today)+metric('近 7 天',usage.week)+metric('累计',usage.all);var tasks=data.local&&data.local.tasks||{},active=tasks.active||[];document.getElementById('active-count').innerHTML=tasks.available?active.length:'?';var activeHtml='';for(i=0;i<active.length;i++)activeHtml+='<div class="active-row"><b>'+esc(active[i].title)+'</b><small>'+esc(active[i].project)+' · 运行中</small></div>';document.getElementById('active').innerHTML=activeHtml||(tasks.available?'当前没有运行任务':'任务状态暂不可用');var p=data.projectTodo,items=p&&p.items||[],done=0,todoHtml='';for(i=0;i<items.length&&i<7;i++){if(items[i].done)done++;todoHtml+='<li class="'+(items[i].done?'done':'')+'"><span class="box">'+(items[i].done?'✓':'')+'</span><span class="todo-text">'+esc(items[i].text)+'</span></li>'}document.getElementById('todo-count').innerHTML=done+'/'+items.length;document.getElementById('todo').innerHTML=p?'<div class="project">'+esc(p.project)+'</div><ul class="todos">'+todoHtml+'</ul>'+(items.length>7?'<small>另有 '+(items.length-7)+' 项</small>':''):'暂无项目 TODO';var days=usage.activity||[],vals=[],heat='';for(i=0;i<days.length;i++)if(!days[i].future&&days[i].tokens>0)vals.push(days[i].tokens);vals.sort(function(a,b){return a-b});function level(n){if(!n)return 0;var k=1,qs=[.25,.5,.75],j;for(j=0;j<qs.length;j++)if(n>vals[Math.floor((vals.length-1)*qs[j])])k++;return k}for(i=0;i<days.length;i+=7){var row=days.slice(i,i+7);heat+='<div class="heat-row"><span class="heat-label">'+((i%21===0||i+7>=days.length)&&row[0]?row[0].date.slice(5).replace('-','/'):'')+'</span>';for(var j=0;j<row.length;j++)heat+='<i class="cell l'+level(row[j].tokens)+(row[j].today?' today':'')+(row[j].future?' future':'')+'"></i>';heat+='</div>'}document.getElementById('activity').innerHTML=heat||'活动数据暂不可用';document.getElementById('stamp').innerHTML=localTime(data.updatedAt)+' 数据<br>'+localTime(data.publishedAt)+' 发布';var status=document.getElementById('status');status.className='status';status.innerHTML=(q.confidence==='stale'||data.local&&data.local.stale?'已更新；部分数据为带时间标记的旧值。':'已取得最新发布数据。')+' 下次自动检查：2 分钟内。'}
function decode(content){return decodeURIComponent(escape(atob(String(content).replace(/\s/g,''))))}function load(){if(timer)clearTimeout(timer);var x=new XMLHttpRequest();x.open('GET',API+'&t='+new Date().getTime(),true);x.setRequestHeader('Accept','application/vnd.github+json');x.onreadystatechange=function(){if(x.readyState!==4)return;var status=document.getElementById('status');try{if(x.status<200||x.status>=300)throw new Error('HTTP '+x.status);var outer=JSON.parse(x.responseText),data=JSON.parse(decode(outer.content));if(data.schema!==1)throw new Error('数据格式不兼容');render(data)}catch(e){status.className='status error';status.innerHTML=lastGood?'本次更新失败，继续显示上次数据。':'暂时无法取得数据，请保持联网后稍候。';if(lastGood)document.getElementById('stamp').innerHTML=localTime(lastGood.publishedAt)+' 旧数据'}timer=setTimeout(load,INTERVAL)};x.onerror=function(){document.getElementById('status').className='status error';document.getElementById('status').innerHTML=lastGood?'网络中断，继续显示上次数据。':'网络中断，等待自动重试。';timer=setTimeout(load,INTERVAL)};x.send(null)}window.onfocus=function(){load()};if(document.addEventListener)document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});load()}());
</script></body></html>
